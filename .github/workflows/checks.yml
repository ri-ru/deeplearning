name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Documentation and cached artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check documentation links, artifact integrity, and summary
        run: python scripts/check_repository.py
