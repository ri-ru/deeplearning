# Full reproduction of the initial RoBERTa judge from the report.
# Start from the repo root:
#   cd code
#   python -m judge_training.train --config ../configs/roberta_base.yaml
run_name: roberta_base_full
csv_path: ../data/reformulated_full.csv
model_name: roberta-base

max_length: 256
epochs: 3
batch_size: 32
eval_batch_size: 64
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.06
val_frac: 0.1
seed: 42
bf16: true
num_workers: 0   # 0 avoids Windows dataloader spawn overhead/errors
