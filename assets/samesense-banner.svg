<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">SameSense — different words, same meaning</title>
  <desc id="description">A schematic of two rationale inputs being compared by a semantic-equivalence judge.</desc>
  <rect width="1280" height="400" rx="18" fill="#123f36"/>
  <g fill="#f4f3e8">
    <text x="58" y="112" font-family="Georgia, serif" font-size="72" letter-spacing="-2">SameSense</text>
    <text x="62" y="182" font-family="Arial, sans-serif" font-size="29">Different words.</text>
    <text x="62" y="220" font-family="Arial, sans-serif" font-size="29">Same meaning.</text>
    <path d="M62 263h451" stroke="#7b9f8e" stroke-width="1"/>
    <text x="62" y="302" font-family="Arial, sans-serif" font-size="19" fill="#c6dbce">Semantic equivalence for moderation rationales</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="618" y="72" width="258" height="90" rx="12" fill="#ecf0e5"/>
    <text x="640" y="106" font-size="18" fill="#183c32">Original rationale</text>
    <path d="M640 126h184m-184 13h143" fill="none" stroke="#698774" stroke-width="3" stroke-linecap="round"/>
    <rect x="618" y="216" width="258" height="90" rx="12" fill="#ecf0e5"/>
    <text x="640" y="250" font-size="18" fill="#183c32">Rewritten rationale</text>
    <path d="M640 270h159m-159 13h185" fill="none" stroke="#698774" stroke-width="3" stroke-linecap="round"/>
    <path d="M876 117h45v72m-45 72h45v-72h39" fill="none" stroke="#b9d899" stroke-width="2"/>
    <path d="m951 183 9 6-9 6" fill="none" stroke="#b9d899" stroke-width="2"/>
    <rect x="970" y="142" width="238" height="94" rx="12" fill="#d0ec9b"/>
    <text x="1089" y="180" text-anchor="middle" font-size="22" font-weight="bold" fill="#183c32">Equivalence judge</text>
    <text x="1089" y="210" text-anchor="middle" font-size="17" fill="#29492c">RoBERTa · 125M parameters</text>
    <path d="M1089 236v34" stroke="#b9d899" stroke-width="2"/>
    <path d="m1083 261 6 9 6-9" fill="none" stroke="#b9d899" stroke-width="2"/>
